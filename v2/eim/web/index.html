<!doctype html>
<html lang="es" data-theme="cyber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EIM · Mesa de trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">EIM</div>
      <select id="symbol" aria-label="Activo"></select>
      <div id="tfs" class="seg" role="group" aria-label="Marco temporal"></div>
      <div id="price" class="price">—</div>
      <div id="live" class="live" data-state="connecting"><i></i><span>Conectando…</span></div>
      <div class="spacer"></div>
      <span id="mode" class="mode" title="Modo de operación">Modo: Análisis</span>
      <button id="paper-btn" class="btn" aria-pressed="false" title="Operaciones de los agentes ejecutadas en papel, con 3 perfiles">Bróker simulado</button>
      <button id="more-btn" class="btn" aria-pressed="false">Más análisis</button>
      <button id="theme" class="btn" aria-label="Cambiar tema">Tema</button>
    </header>
    <section id="more" class="more" aria-label="Más análisis" hidden></section>
    <section id="paper" class="paper" aria-label="Bróker simulado" hidden></section>
    <section id="river" class="river" aria-label="Río de decisión"></section>
    <section id="setups" class="setups" aria-label="Operaciones sugeridas"></section>
    <main class="desk">
      <section id="simbar" class="simbar" aria-label="Simulador de operación"></section>
      <section class="chart-wrap">
        <div id="chart"></div>
        <div id="layerbar" class="layerbar" role="group" aria-label="Capas"></div>
        <div id="evcard" class="evcard" hidden></div>
        <div id="banner" class="banner" hidden></div>
        <div id="replay" class="replay" hidden>
          <span id="replay-label" class="muted">En vivo</span>
          <input id="replay-range" type="range" min="0" max="0" value="0" aria-label="Reproducir decisiones pasadas" />
          <button id="replay-live" class="btn" hidden>Volver a en vivo</button>
        </div>
        <div id="source" class="source"></div>
      </section>
      <section class="bottom">
        <nav class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="t-esc">Escenarios</button>
          <button role="tab" aria-selected="false" data-tab="t-cal">Calibración</button>
          <button role="tab" aria-selected="false" data-tab="t-plan">Plan</button>
          <button role="tab" aria-selected="false" data-tab="t-op">Operación</button>
          <button role="tab" aria-selected="false" data-tab="t-arb" id="tab-arb">Arbitraje</button>
          <button role="tab" aria-selected="false" data-tab="t-log">Bitácora</button>
        </nav>
        <div class="tabbody" id="t-esc"><p class="muted">Cargando escenarios…</p></div>
        <div class="tabbody" id="t-cal" hidden><p class="muted">Cargando calibración…</p></div>
        <div class="tabbody" id="t-plan" hidden><p class="muted">Consultando el motor de riesgo…</p></div>
        <div class="tabbody" id="t-op" hidden><p class="muted">Consultando el servicio de operación…</p></div>
        <div class="tabbody" id="t-arb" hidden><p class="muted">Consultando el escáner de arbitraje…</p></div>
        <div class="tabbody" id="t-log" hidden><div id="trades-log"></div><h4>Reportes de agentes</h4><div id="journal"></div></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
