[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eim"
version = "0.1.0"
description = "EIM — agente multiagente de trading de futuros (BTC/ETH)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas",
    "numpy",
    "fastapi",
    "uvicorn",
    "duckdb",
    "httpx",
    "python-multipart",
    "openpyxl",
    "yfinance",
    "websockets",
    "scipy",  # BSD-3; agents/regime/bocpd.py (gammaln)
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "optuna>=4", "pip-audit",  # pip-audit: T32
       "python-binance"]  # MIT; solo el oráculo legado (legacy/F7 importa binance.client), no producción
calib = ["optuna>=4"]  # T26: calibración (MIT)
stats = ["arch==8.0.0"]  # T161: SPA, MCS y bloque de Politis-White (NCSA; trae statsmodels BSD-3, patsy BSD-2)
library = ["pypdf>=6", "pytesseract", "Pillow"]  # T52: biblioteca (BSD-3 / Apache-2.0 / MIT-CMU); OCR exige además el binario Tesseract
kronos = ["torch>=2", "einops", "huggingface_hub==0.33.1", "safetensors"]
# T62 (auditoría en PLAN/notas/T62_auditoria.md): versiones exactas auditadas, en un entorno aparte
# (EIM_LOCALAI_DIR, docs/OPERACION.md §7, junto con `library`); el gate no las exige. Lista
# aprobada por el usuario el 2026-10-31.
video = ["scenedetect-headless==0.7.2", "opencv-python-headless==4.14.0.94",  # BSD-3 / Apache-2.0
         "rapidocr==3.10.0", "onnxruntime==1.31.1",  # Apache-2.0 (pesos PP-OCRv6 Apache-2.0) / MIT
         "faster-whisper==1.2.1", "ctranslate2==4.8.3",  # MIT / MIT (CPU int8; Maxwell sin GPU)
         "av==18.1.0"]  # BSD-3; PyAV 19 quitó `metadata_errors`, que usa faster-whisper 1.2.1 (#1589)
localai = ["pydantic-ai-slim[openai]==2.64.0"]  # MIT; solo si mejora a la validación propia

[tool.setuptools.packages.find]
include = ["eim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"eim/api/more.py" = ["B008"]  # idioma FastAPI: File()/Form() en defaults
"eim/api/risk.py" = ["B008"]  # idioma FastAPI: Header() en defaults
"eim/observability/catalog/*" = ["E501"]  # tablas de prosa para el usuario (T72)
"eim/analytics/*" = ["E501"]  # migrado literal de F7/eim_bitacora.py

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "perf: mide tiempo de reloj contra un umbral fijo; sigue en el gate (-m \"not perf\" solo para aislarla al diagnosticar)",
]

[tool.pyright]
include = ["eim"]
pythonVersion = "3.11"
