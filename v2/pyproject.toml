[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eim"
version = "0.1.0"
description = "EIM — agente multiagente de trading de futuros (BTC/ETH)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas",
    "numpy",
    "fastapi",
    "uvicorn",
    "duckdb",
    "httpx",
    "python-multipart",
    "openpyxl",
    "yfinance",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]
kronos = ["torch>=2", "einops", "huggingface_hub==0.33.1", "safetensors"]

[tool.setuptools.packages.find]
include = ["eim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"eim/api/more.py" = ["B008"]  # idioma FastAPI: File()/Form() en defaults
"eim/analytics/*" = ["E501"]  # migrado literal de F7/eim_bitacora.py

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["eim"]
pythonVersion = "3.11"
